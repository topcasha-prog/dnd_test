<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по сюжету D&D кампании</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #e0e0e0; min-height: 100vh; padding: 20px; line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center; color: #e8b923; margin-bottom: 10px;
    font-size: 2em; text-shadow: 0 0 10px rgba(232,185,35,.5);
  }
  .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-style: italic; }
  .instruction {
    text-align: center; color: #a0a0c0; margin-bottom: 30px; padding: 10px;
    background: rgba(232,185,35,.1); border-radius: 6px; border-left: 3px solid #e8b923;
  }
  .block-title {
    color: #e8b923; margin: 35px 0 15px; padding-bottom: 8px;
    border-bottom: 2px solid #e8b923; font-size: 1.3em;
  }
  .question {
    background: rgba(255,255,255,.05); border-radius: 10px; padding: 20px;
    margin-bottom: 15px; border-left: 4px solid #4a5568;
    transition: border-color .3s, background .3s;
  }
  .question.correct { border-left-color: #48bb78; background: rgba(72,187,120,.08); }
  .question.wrong   { border-left-color: #f56565; background: rgba(245,101,101,.08); }
  .q-number {
    color: #e8b923; font-size: .85em; font-weight: bold; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .question h3 { font-size: 1.05em; margin-bottom: 12px; color: #fff; font-weight: 500; }
  .question label {
    display: block; padding: 10px 15px; margin: 6px 0;
    background: rgba(255,255,255,.05); border-radius: 6px; cursor: pointer;
    transition: background .2s; border: 1px solid transparent;
  }
  .question label:hover { background: rgba(232,185,35,.15); }
  .question input[type="radio"] { margin-right: 10px; accent-color: #e8b923; }
  .question label.correct-answer {
    background: rgba(72,187,120,.25); border-color: #48bb78;
  }
  .question label.wrong-answer {
    background: rgba(245,101,101,.2); border-color: #f56565;
  }
  .submit-btn {
    display: block; margin: 30px auto; padding: 15px 50px; font-size: 1.2em;
    background: linear-gradient(135deg, #e8b923, #c99a1a); color: #1a1a2e;
    border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
    transition: transform .2s;
  }
  .submit-btn:hover { transform: scale(1.05); }
  .result {
    display: none; margin: 30px 0; padding: 30px;
    background: rgba(255,255,255,.08); border-radius: 12px;
    text-align: center; border: 2px solid #e8b923;
  }
  .result.show { display: block; }
  .result .score { font-size: 3em; color: #e8b923; margin-bottom: 10px; font-weight: bold; }
  .result .score-label { font-size: 1em; color: #a0a0c0; margin-bottom: 15px; }
  .result .rank { font-size: 1.8em; color: #e8b923; margin: 15px 0; font-weight: bold; }
  .result .desc { font-size: 1.1em; color: #ccc; max-width: 600px; margin: 0 auto 10px; }
  .result .result-img {
    display: none;
    max-width: 100%;
    width: 400px;
    height: auto;
    margin: 20px auto 10px;
    border-radius: 12px;
    border: 3px solid #e8b923;
    box-shadow: 0 0 25px rgba(232,185,35,.4);
  }
  .result .result-img.show { display: block; }
  .restart-btn {
    padding: 10px 30px; background: #4a5568; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 10px;
  }
  .restart-btn:hover { background: #2d3748; }
</style>
</head>
<body>
<div class="container">
  <h1>Тест по сюжету кампании</h1>
  <p class="subtitle">Проверь, насколько хорошо ты знаешь историю</p>
  <p class="instruction">Выберите один вариант ответа в каждом вопросе, затем нажмите «Узнать результат»</p>

  <form id="quiz" onsubmit="return false;">
    <div id="questions"></div>
    <button type="button" class="submit-btn" id="submitBtn">Узнать результат</button>
  </form>

  <div class="result" id="result">
    <div class="score" id="score"></div>
    <div class="score-label">правильных ответов</div>
    <div class="rank" id="rank"></div>
    <div class="desc" id="desc"></div>
    <img class="result-img" id="resultImg" alt="Персонаж" onerror="this.classList.remove('show')">
    <button class="restart-btn" id="restartBtn">Пройти заново</button>
  </div>
</div>

// ===== КАРТИНКИ ДЛЯ РЕЗУЛЬТАТОВ =====
const RANK_IMAGES = {
  'Дубок':          'img/dubok.jpg',
  'Фархад':         'img/farhad.jpg',
  'Мизухара':       'img/mizuhara.jpg',
  'Истинные герои': 'img/heroes.jpg',
  'Лансель':        'img/lancel.jpg'
};

// ---------- Рендер вопросов ----------
const questionsEl = document.getElementById('questions');
let qCounter = 0;

QUESTIONS.forEach((item, idx) => {
  if (item.type === 'header') {
    const h = document.createElement('h2');
    h.className = 'block-title';
    h.textContent = item.text;
    questionsEl.appendChild(h);
    return;
  }
  qCounter++;
  const div = document.createElement('div');
  div.className = 'question';
  div.id = 'q-' + idx;

  const num = document.createElement('div');
  num.className = 'q-number';
  num.textContent = 'Вопрос ' + qCounter;
  div.appendChild(num);

  const title = document.createElement('h3');
  title.textContent = item.q;
  div.appendChild(title);

  item.options.forEach((opt, i) => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'q' + idx;
    input.value = i;
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt));
    div.appendChild(label);
  });

  questionsEl.appendChild(div);
});

// ---------- Проверка ----------
document.getElementById('submitBtn').addEventListener('click', () => {
  let correctCount = 0;
  let total = 0;

  QUESTIONS.forEach((item, idx) => {
    if (item.type === 'header') return;
    total++;
    const qDiv = document.getElementById('q-' + idx);
    const selected = document.querySelector('input[name="q' + idx + '"]:checked');
    const selectedVal = selected ? parseInt(selected.value, 10) : -1;

    const labels = qDiv.querySelectorAll('label');
    labels.forEach((label, i) => {
      label.classList.remove('correct-answer', 'wrong-answer');
      if (i === item.correct) label.classList.add('correct-answer');
      if (i === selectedVal && i !== item.correct) label.classList.add('wrong-answer');
    });

    if (selectedVal === item.correct) {
      qDiv.classList.add('correct');
      qDiv.classList.remove('wrong');
      correctCount++;
    } else {
      qDiv.classList.add('wrong');
      qDiv.classList.remove('correct');
    }
  });

  const pct = Math.round((correctCount / total) * 100);
  const resultEl = document.getElementById('result');
  document.getElementById('score').textContent = correctCount + ' / ' + total + ' (' + pct + '%)';

  let rank, desc;
  if (pct < 30) {
    rank = 'Дубок';
    desc = 'Вы движетесь в этом мире согласно своей логике и поэтому счастливы.';
  } else if (pct < 50) {
    rank = 'Фархад';
    desc = 'Вы следите за сохранностью героев... когда не делаете чай... а чай вы делаете часто.';
  } else if (pct < 75) {
    rank = 'Мизухара';
    desc = 'Ваши знания охватывают весь мир, и порой вам приходится принимать сложные решения в недостатках данных.';
  } else if (pct < 90) {
    rank = 'Истинные герои';
    desc = 'Вы движетесь с целью спасения мира.';
  } else {
    rank = 'Лансель';
    desc = 'Вы знаете прошлое и будущее.';
  }

  document.getElementById('rank').textContent = rank;
  document.getElementById('desc').textContent = desc;

  // Показ картинки
  const imgEl = document.getElementById('resultImg');
  const imgPath = RANK_IMAGES[rank];
  if (imgPath) {
    imgEl.src = imgPath;
    imgEl.alt = rank;
    imgEl.classList.add('show');
  } else {
    imgEl.classList.remove('show');
  }

  resultEl.classList.add('show');
  document.getElementById('submitBtn').style.display = 'none';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---------- Перезапуск ----------
document.getElementById('restartBtn').addEventListener('click', () => {
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  document.querySelectorAll('.question').forEach(q => {
    q.classList.remove('correct', 'wrong');
    q.querySelectorAll('label').forEach(l => l.classList.remove('correct-answer', 'wrong-answer'));
  });
  const resultEl = document.getElementById('result');
  const imgEl = document.getElementById('resultImg');
  imgEl.classList.remove('show');
  imgEl.removeAttribute('src');
  resultEl.classList.remove('show');
  document.getElementById('submitBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
